<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Домашний ИБП</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#15171c; --mute:#6b7280; --line:#e3e5ea;
  --ok:#14864a; --okbg:#e3f5ea; --warn:#b35c00; --warnbg:#fff1dc; --bad:#c62828; --badbg:#fde4e4;
  --acc:#2457d6; --bar:#e6e8ec;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101216; --card:#1a1d23; --ink:#eef0f4; --mute:#9aa1ad; --line:#2b2f37;
    --ok:#3ccf7d; --okbg:#143222; --warn:#ffb14a; --warnbg:#3a2a10; --bad:#ff6b6b; --badbg:#3d1717;
    --acc:#7aa2ff; --bar:#2b2f37;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:20px;margin:0;flex:1;font-weight:650}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.sm{padding:8px 12px;font-size:14px;border-radius:10px}
button.sel{outline:3px solid var(--acc);outline-offset:-3px}
button:disabled{opacity:.5}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.big{font-size:26px;font-weight:700;line-height:1.2}
.sub{color:var(--mute);font-size:16px;margin-top:4px}
.ac.on{background:var(--okbg);border-color:transparent}
.ac.on .big{color:var(--ok)}
.ac.off{background:var(--warnbg);border-color:transparent}
.ac.off .big{color:var(--warn)}
.soc{display:flex;align-items:baseline;gap:10px}
.soc .pct{font-size:56px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:18px;border-radius:9px;background:var(--bar);overflow:hidden;margin:12px 0 10px}
.meter i{display:block;height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .6s}
.left{font-size:20px;font-weight:600}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:17px;font-weight:600}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.connect{text-align:center;padding:28px 16px}
.connect p{color:var(--mute);margin:12px 0 0}
details.card{padding:0}
details summary{padding:16px;font-weight:650;cursor:pointer;list-style:none;font-size:17px}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"▾";float:right;color:var(--mute)}
details[open] summary:after{content:"▴"}
.det{padding:0 16px 16px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:18px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right}
.cells{display:grid;grid-template-columns:auto repeat(4,1fr) auto;gap:6px;align-items:center;font-variant-numeric:tabular-nums;font-size:15px}
.cells b{font-weight:600}
.cell{text-align:center;padding:6px 0;border-radius:8px;background:var(--bar)}
.cell.hi{background:var(--warnbg);color:var(--warn);font-weight:700}
.hist{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}
.hist i{flex:1;min-width:4px;border-radius:3px 3px 0 0}
.hist i.on{background:var(--ok)} .hist i.off{background:var(--warn)}
.legend{font-size:13px;color:var(--mute);margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.term{display:flex;gap:8px;margin-top:8px}
.term input{flex:1;min-width:0}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
pre:empty{display:none}
pre{background:#0d0f12;color:#9ef0b0;padding:10px;border-radius:10px;font-size:12px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{flex:1;color:var(--mute)}
.hide{display:none!important}
.foot{color:var(--mute);font-size:13px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <h1>Домашний ИБП</h1>
    <button class="sec sm hide" id="btnDis">Отключить</button>
  </header>

  <div class="card connect" id="cConnect">
    <button id="btnCon" style="font-size:20px;padding:16px 28px">Подключиться</button>
    <p id="conMsg">Нажмите и выберите устройство «ups …»</p>
  </div>

  <div id="main" class="hide">
    <div id="alerts"></div>
    <div class="card ac" id="cAc">
      <div class="big" id="acTxt">—</div>
      <div class="sub" id="acSub"></div>
    </div>
    <div class="card">
      <div class="soc"><span class="pct" id="soc">—</span><span class="sub" id="socSub">заряд батареи</span></div>
      <div class="meter"><i id="meter"></i></div>
      <div class="left" id="left">—</div>
      <div class="sub" id="flow"></div>
    </div>

    <details class="card" id="det">
      <summary>Подробно</summary>
      <div class="det">
        <h3>Зарядник</h3>
        <table id="tChg"></table>
        <h3>Ячейки, В</h3>
        <div class="cells" id="cells"></div>
        <h3>Прогноз и статистика</h3>
        <table id="tFc"></table>
        <div class="hist" id="hist"></div>
        <div class="legend">последние периоды: <span style="color:var(--ok)">■</span> свет, <span style="color:var(--warn)">■</span> отключение</div>
        <h3>Инвертор</h3>
        <table id="tInv"></table>
        <h3>Режим заряда</h3>
        <div class="btns" id="prof">
          <button class="sec sm" data-p="-1">Авто</button>
          <button class="sec sm" data-p="0">Стандарт</button>
          <button class="sec sm" data-p="1">Турбо</button>
          <button class="sec sm" data-p="2">Калибровка</button>
        </div>
        <div class="btns" style="margin-top:8px">
          <button class="sec sm" id="btnCal">Калибровать при следующем заряде</button>
        </div>
        <h3>Терминал</h3>
        <div class="term">
          <input id="cmd" placeholder="st()" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="sm" id="btnSend">Отпр.</button>
        </div>
        <pre id="log"></pre>
        <h3>Настройки</h3>
        <div class="row"><label for="pwd">Пароль устройства</label><input id="pwd" type="password" style="width:55%"></div>
        <div class="row"><label for="poll">Опрос, сек</label><input id="poll" type="number" min="2" max="60" style="width:30%"></div>
        <div class="btns" style="margin-top:10px"><button class="sec sm" id="btnForget">Забыть устройство</button></div>
      </div>
    </details>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
/* ===== settings ===== */
/* UART service: Nordic UUID (Espruino nRF52) and the alternative one, tried in this order */
const UARTS = [
  ["6e400001-b5a3-f393-e0a9-e50e24dcca9e","6e400002-b5a3-f393-e0a9-e50e24dcca9e","6e400003-b5a3-f393-e0a9-e50e24dcca9e"],
  ["6e400001-b5a3-13a5-e54e-37593c00fba5","6e400002-b5a3-13a5-e54e-37593c00fba5","6e400003-b5a3-13a5-e54e-37593c00fba5"]
];
const NAME_PREFIX = "ups";
const CHUNK = 20;
const DEF_PASS = "";            /* leave empty: password is entered once in settings and kept on this phone */
const LOW_BAD = 20, LOW_WARN = 35;
const HIDE_DISCONNECT_S = 60;   /* free BLE link when app is in background */

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("ups_"+k); return v===null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("ups_"+k, v); } catch(e){} }
};
const DEMO = /[?&]demo/.test(location.search);

let dev=null, tx=null, connecting=false, wantConn=false, writeChain=Promise.resolve();
let rxBuf="", lineBuf="", data=null, lastData=0, pollTm=null, hideTm=null, reTm=null, connTime=0;

/* ===== log / terminal ===== */
function log(s){
  const el=$("log"); el.textContent += s+"\n";
  if (el.textContent.length>15000) el.textContent = el.textContent.slice(-8000);
  el.scrollTop = el.scrollHeight;
}
function onRx(str){
  rxBuf += str;
  let m;
  while ((m = rxBuf.match(/@@(\{[\s\S]*?\})@@/))) {
    const pre = rxBuf.slice(0, m.index);
    rxText(pre);
    try { data = JSON.parse(m[1]); lastData = Date.now(); render(); } catch(e){ log("JSON error: "+e.message); }
    rxBuf = rxBuf.slice(m.index + m[0].length);
  }
  const k = rxBuf.lastIndexOf("@@");
  if (k<0) { rxText(rxBuf); rxBuf=""; }
  else { rxText(rxBuf.slice(0,k)); rxBuf = rxBuf.slice(k); if (rxBuf.length>4000) rxBuf=""; }
}
function rxText(s){
  if (!s) return;
  lineBuf += s.replace(/\x1b\[[0-9;]*[A-Za-z]/g,"").replace(/\r/g,"");
  const parts = lineBuf.split("\n"); lineBuf = parts.pop();
  for (const ln of parts){ const t=ln.trim(); if (t && t!==">" && !/^=undefined$/.test(t)) log(t); }
}

/* ===== BLE ===== */
function setConn(state, msg){
  $("dot").className = "dot" + (state==="on" ? " on" : state==="wait" ? " wait" : "");
  if (msg!==undefined) $("conMsg").textContent = msg;
  const on = state==="on";
  const b = $("btnDis");
  b.classList.toggle("hide", DEMO || (!on && !data));
  b.textContent = on ? "Отключить" : (state==="wait" ? "…" : "Подключить");
  b.disabled = (state==="wait");
  if (on || DEMO) { $("cConnect").classList.add("hide"); $("main").classList.remove("hide"); }
  else if (!data) { $("cConnect").classList.remove("hide"); }
  $("btnCon").disabled = (state==="wait");
}
function bleWrite(str){
  writeChain = writeChain.then(async () => {
    if (!tx) return;
    const b = new TextEncoder().encode(str);
    try { for (let i=0;i<b.length;i+=CHUNK) await tx.writeValue(b.slice(i,i+CHUNK)); }
    catch(e){ log("write error: "+e.message); }
  });
  return writeChain;
}
/* \x10 at line start = Espruino does not echo this line */
function cmd(s){ return bleWrite("\x10"+s+"\n"); }

async function connect(d){
  if (connecting || tx) return;
  connecting = true; wantConn = true; dev = d;
  if (!d._l){ d.addEventListener("gattserverdisconnected", onDisc); d._l = true; }
  setConn("wait", "Подключаюсь к «"+(d.name||"ups")+"»…");
  try {
    const srv = await Promise.race([d.gatt.connect(), new Promise((_,r)=>setTimeout(()=>r(new Error("таймаут")),15000))]);
    let svc=null, u=null;
    for (const x of UARTS) { try { svc = await srv.getPrimaryService(x[0]); u = x; break; } catch(_){} }
    if (!svc) throw new Error("нет UART-сервиса");
    const t = await svc.getCharacteristic(u[1]);
    const r = await svc.getCharacteristic(u[2]);
    await r.startNotifications();
    r.addEventListener("characteristicvaluechanged", e => onRx(new TextDecoder().decode(e.target.value)));
    tx = t; connTime = Date.now();
    store.set("dev", d.id);
    log("BLE connected: "+(d.name||d.id));
    setConn("on");
    const pass = store.get("pass", DEF_PASS);
    await new Promise(res=>setTimeout(res,300));
    if (pass) await bleWrite(pass+"\n");      /* unlock console */
    await new Promise(res=>setTimeout(res,300));
    startPoll();
  } catch(e){
    tx = null;
    log("connect error: "+e.message);
    try { d.gatt.disconnect(); } catch(_){}
    setConn("off", "Нет связи: "+e.message+". Повтор…");
    scheduleReconnect();
  } finally { connecting = false; }
}
function onDisc(){
  tx = null; stopPoll();
  log("BLE disconnected");
  setConn("off", "Связь потеряна. Переподключаюсь…");
  render();
  if (wantConn) scheduleReconnect();
}
function scheduleReconnect(){
  if (reTm || !wantConn) return;
  reTm = setTimeout(()=>{ reTm=null; autoConnect(); }, 3000);
}
async function autoConnect(){
  if (tx || connecting || document.hidden) return;
  if (dev) return waitAdv(dev);
  if (!navigator.bluetooth) { setConn("off","Этот браузер не умеет Bluetooth. Нужен Chrome на Android/компьютере, на iPhone — приложение Bluefy."); $("btnCon").disabled=true; return; }
  if (!navigator.bluetooth.getDevices) return;
  const list = await navigator.bluetooth.getDevices();
  const id = store.get("dev", null);
  const d = list.find(x=>x.id===id) || list.find(x=>(x.name||"").startsWith(NAME_PREFIX));
  if (d) { wantConn = true; waitAdv(d); }
}
/* after page reload Chrome connects to a known device only after it sees its advertising */
async function waitAdv(d){
  if (!d.watchAdvertisements) return connect(d);
  setConn("wait","Ищу «"+(d.name||"ups")+"»…");
  const ac = new AbortController(); let done=false;
  const fin = () => { if (done) return; done=true; d.removeEventListener("advertisementreceived", fin); clearTimeout(tm); try{ac.abort();}catch(_){}; connect(d); };
  const tm = setTimeout(fin, 10000);
  d.addEventListener("advertisementreceived", fin);
  try { await d.watchAdvertisements({signal: ac.signal}); } catch(e){ fin(); }
}
async function pick(){
  if (!navigator.bluetooth) { setConn("off","Этот браузер не умеет Bluetooth. Нужен Chrome на Android/компьютере, на iPhone — приложение Bluefy."); return; }
  try {
    const d = await navigator.bluetooth.requestDevice({filters:[{namePrefix:NAME_PREFIX}], optionalServices:UARTS.map(x=>x[0])});
    if (tx && dev && dev!==d) { try{dev.gatt.disconnect();}catch(_){} tx=null; }
    dev = null; connect(d);
  } catch(e){ if (e.name!=="NotFoundError") setConn("off","Ошибка: "+e.message); }
}
function disconnect(){
  wantConn = false; stopPoll();
  if (dev) { try { dev.gatt.disconnect(); } catch(_){} }
  tx = null; setConn("off","Отключено");
}
function startPoll(){
  stopPoll();
  const p = Math.max(2, Math.min(60, +store.get("poll", 5) || 5));
  cmd("js()");
  pollTm = setInterval(()=>{ cmd("js()"); render(); }, p*1000);
}
function stopPoll(){ if (pollTm) { clearInterval(pollTm); pollTm=null; } }

/* free the single BLE link when app goes to background, reconnect when back */
document.addEventListener("visibilitychange", ()=>{
  if (DEMO) return;
  if (document.hidden) {
    hideTm = setTimeout(()=>{ if (document.hidden && tx) { const w=true; disconnect(); wantConn=w; } }, HIDE_DISCONNECT_S*1000);
  } else {
    clearTimeout(hideTm);
    if (wantConn && !tx) autoConnect();
  }
});

/* ===== formatting ===== */
function hm(sec){
  if (sec==null || isNaN(sec) || sec<0) return "—";
  const m = Math.round(sec/60), h = Math.floor(m/60), mm = m%60;
  if (h===0) return mm+" мин";
  if (h>=48) return Math.round(h/24)+" сут";
  return h+" ч"+(mm? " "+mm+" мин" : "");
}
function hh(h){ return h==null ? "—" : hm(h*3600); }
const n1 = v => (v==null || isNaN(v)) ? "—" : (+v).toFixed(1);
const PROF = ["стандарт","турбо","калибровка"];
const WHY = {start:"выбран на старте", cell:"снижен: разбег ячеек", hi:"снижен: ячейка высоко", late:"повышен: не успеваем", nobms:"нет данных BMS", "":"—"};
const STATE = {ac_powered_charg_on:"заряжает", ac_powered_charg_off:"ожидание", battery_powered:"работа от батареи", start:"запуск"};
function rows(el, list){ el.innerHTML = list.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join(""); }

/* ===== render ===== */
function render(){
  if (!data) return;
  const d = data, stale = (Date.now()-lastData) > 20000 || !tx && !DEMO;
  const soc = Math.round((d.sc[0]+d.sc[1])/2);
  const ac = !!d.ac;
  const age = d.ae + (DEMO ? 0 : Math.max(0,(Date.now()-lastData)/1000));
  const dis = (!ac && d.ib < -0.3) ? -d.ib : d.ld;
  const leftH = d.rm / Math.max(dis, 0.5);
  const offLeftH = Math.max(0, d.wf - (ac?0:age/3600));
  const ovl = d.iv && d.iv[4], fault = d.iv && d.iv[5];

  /* alerts */
  const al = [];
  if (stale) al.push(["warn", tx ? "Нет свежих данных от ИБП. Проверьте пароль в «Подробно → Настройки»." : "Нет связи с ИБП. Показаны последние данные."]);
  if (ovl) al.push(["bad","Перегрузка! Выключите мощные приборы: чайник, кондиционер, хлебопечку."]);
  if (fault) al.push(["bad","Инвертор сообщает об ошибке."]);
  if (!d.bk) al.push(["warn","Нет связи с батареями (BMS). Цифры заряда могут быть неточными."]);
  if (!ac && soc < LOW_BAD) al.push(["bad","Заряд почти кончился — пора запускать генератор."]);
  else if (!ac && soc < LOW_WARN) al.push(["warn","Заряда осталось мало. Не включайте мощные приборы."]);
  else if (!ac && leftH < offLeftH) al.push(["warn","Может не хватить до включения света (отключения бывают до "+hh(d.wf)+")."]);
  $("alerts").innerHTML = al.map(([c,t])=>`<div class="alert ${c}">${t}</div>`).join("");

  /* AC card */
  $("cAc").className = "card ac " + (ac ? "on" : "off");
  $("acTxt").textContent = ac ? "Свет есть" : "Света нет";
  $("acSub").textContent = (ac ? "уже " : "уже ") + hm(age) + (ac ? "" : " — работаем от батареи");

  /* battery */
  $("soc").textContent = soc + "%";
  const mt = $("meter"); mt.style.width = Math.max(0,Math.min(100,soc))+"%";
  mt.style.background = soc<LOW_BAD ? "var(--bad)" : soc<LOW_WARN ? "var(--warn)" : "var(--ok)";
  $("left").textContent = ac ? ("Если свет отключат — хватит на ~" + hh(leftH)) : ("Хватит примерно на " + hh(leftH));
  let flow;
  if (ac && d.rl && d.ib > 0.5) flow = "Заряжается, " + n1(d.ib) + " А";
  else if (ac && soc >= 97) flow = "Батарея заряжена";
  else if (ac) flow = "Ждёт, заряд не нужен";
  else flow = "Расход " + n1(-d.ib) + " А" + (d.iv ? ", нагрузка " + d.iv[0] + "%" : "");
  $("flow").textContent = flow;

  /* details */
  rows($("tChg"), [
    ["Состояние", STATE[d.st] || d.st],
    ["Режим", PROF[d.pf] + (d.fo>=0 ? " (вручную)" : " (авто)") + (d.cr ? ", ждёт калибровку" : "")],
    ["Уставка", n1(d.is)+" А, "+(+d.vs).toFixed(2)+" В"],
    ["Выход", (d.io>0 ? n1(d.io)+" А, "+(+d.vo).toFixed(2)+" В" : "—")],
    ["Ток выбран", WHY[d.wy] || d.wy],
    ["Батарея", n1(d.ib)+" А, "+n1(d.vb)+" В, "+n1(d.rm)+" из "+n1(d.nm)+" А·ч"],
    ["Цель заряда", d.tg+"%"]
  ]);
  const allc = d.c0.concat(d.c1).filter(v=>v>0), vmax = Math.max(...allc);
  let ch = "";
  [d.c0, d.c1].forEach((c,j)=>{
    const ok = c.filter(v=>v>0), dv = ok.length ? Math.max(...ok)-Math.min(...ok) : 0;
    ch += `<b>Б${j+1}</b>` + c.map(v=>`<span class="cell${v===vmax&&v>=3400?" hi":""}">${v?(v/1000).toFixed(3):"—"}</span>`).join("")
        + `<span>${dv} мВ</span>`;
  });
  $("cells").innerHTML = ch + `<span></span><span style="grid-column:2/7;color:var(--mute);font-size:13px">темп. ${n1(d.tp[0])}/${n1(d.tp[1])} °C, циклы BMS ${d.cy[0]}/${d.cy[1]}</span>`;
  rows($("tFc"), [
    ["Окно света, не меньше", hh(d.wn)],
    ["Отключение, не больше", hh(d.wf)],
    ["Средний расход", n1(d.ld)+" А"],
    ["До калибровки", d.cn+"/"+d.cN+" окон, "+d.ch+"/"+d.cH+" ч"],
    ["Зарядов / калибровок / перегрузок", d.ng+" / "+d.nc+" / "+d.no]
  ]);
  const hs = [];
  for (let i=0;i<Math.max(d.hn.length,d.hf.length);i++){ if (d.hn[i]!=null) hs.push(["on",d.hn[i]]); if (d.hf[i]!=null) hs.push(["off",d.hf[i]]); }
  const hmax = Math.max(1,...hs.map(x=>x[1]));
  $("hist").innerHTML = hs.map(([c,v])=>`<i class="${c}" style="height:${Math.max(4,v/hmax*100)}%" title="${hh(v)}"></i>`).join("");
  rows($("tInv"), d.iv ? [
    ["Нагрузка", d.iv[0]+"%"], ["Выход", d.iv[1]+" В"], ["Сеть на входе", d.iv[2]+" В"], ["Температура", n1(d.iv[3])+" °C"]
  ] : [["Нет данных по RS232",""]]);
  document.querySelectorAll("#prof button").forEach(b=>{
    const p = +b.dataset.p;
    b.classList.toggle("sel", d.fo<0 ? p===-1 : p===d.fo);
  });
  $("foot").textContent = "прошивка " + d.v + " · работает " + hm(d.up) + (DEMO ? " · ДЕМО" : "");
}

/* ===== UI ===== */
$("btnCon").onclick = pick;
$("btnDis").onclick = () => { if (tx) disconnect(); else { wantConn = true; if (dev) waitAdv(dev); else pick(); } };
$("btnSend").onclick = () => { const v=$("cmd").value.trim(); if (!v) return; log("> "+v); if (tx) bleWrite(v+"\n"); $("cmd").value=""; };
$("cmd").addEventListener("keydown", e=>{ if (e.key==="Enter") $("btnSend").click(); });
document.querySelectorAll("#prof button").forEach(b=> b.onclick = () => {
  const p = +b.dataset.p;
  if (p===2 && !confirm("Включить калибровку (полный заряд до 14,4 В)?")) return;
  cmd("pr("+p+")"); setTimeout(()=>cmd("js()"), 500);
});
$("btnCal").onclick = () => { if (confirm("Сделать калибровку при следующем заряде?")) { cmd("cal()"); setTimeout(()=>cmd("js()"),500); } };
$("pwd").value = store.get("pass", DEF_PASS);
$("pwd").onchange = () => { store.set("pass", $("pwd").value); if (tx) bleWrite($("pwd").value+"\n"); };
$("poll").value = store.get("poll", 5);
$("poll").onchange = () => { store.set("poll", $("poll").value); if (tx) startPoll(); };
$("btnForget").onclick = async () => {
  if (!confirm("Забыть устройство? Потом нужно будет выбрать его заново.")) return;
  const d = dev; disconnect(); store.set("dev","");
  if (d && d.forget) { try { await d.forget(); } catch(_){} }
  dev = null; data = null; $("main").classList.add("hide"); $("cConnect").classList.remove("hide");
};

/* first run: ask password once */
if (!DEMO && !store.get("pass", DEF_PASS)) {
  $("conMsg").innerHTML = 'Первый запуск: введите пароль устройства<br><input id="pwd0" type="password" style="margin-top:10px;width:80%">';
  $("pwd0").onchange = () => { store.set("pass", $("pwd0").value); $("pwd").value = $("pwd0").value; };
}
